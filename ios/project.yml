# XcodeGen project definition.
#
# Generate the Xcode project with XcodeGen.
# XcodeGen is not packaged in MacPorts, so build it from source once:
#     git clone --depth 1 --branch 2.43.0 https://github.com/yonaskolb/XcodeGen.git
#     cd XcodeGen && swift build -c release      # binary: .build/release/xcodegen
# Then, from this directory:
#     <path-to>/xcodegen generate
#
# Prerequisite: FossilCore.xcframework must exist (built by
# scripts/build-fossil-xcframework.sh). The app target only links that one
# artifact plus system libraries, keeping the project small and the Fossil
# core cleanly decoupled.

name: Stone
options:
  bundleIdPrefix: org.beagleboard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Stone:
    type: application
    platform: iOS
    sources:
      - path: Stone
      - path: FossilBridge
        # Only the public header is needed by Swift; the .c is already compiled
        # into FossilCore.xcframework. Exclude the .c to avoid double-building.
        excludes:
          - "StoneFossil.c"
      # Vendored Mozilla CA bundle, copied into the app bundle as a resource so
      # OpenSSL can verify https remotes (iOS has no OpenSSL-readable store).
      - path: ../vendor/cacert.pem
        buildPhase: resources
    dependencies:
      - framework: Frameworks/FossilCore.xcframework
        embed: false            # static library — linked, not embedded
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      # NOTE (ticket f0c612c027): this target deliberately does NOT link
      # libsqlite3.tbd. MaintainerRequestScanner used to (ticket 1a55c5d8b8),
      # for a second, independent, read-only connection straight to a
      # repo's .fossil (= SQLite) file -- but a second SQLite library in the
      # same process as FossilCore.xcframework's own bundled SQLite crossed
      # authorizer/protection state with Fossil's, and made Fossil's own
      # post-sync writes fail with SQLITE_AUTH. The scanner now reads
      # through `stone_fossil_query` (FossilBridge/StoneFossil.h), which
      # uses Fossil's own bundled SQLite -- see that file's doc. Do not
      # re-add this entry without also re-auditing that fix.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beagleboard.stone
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        SWIFT_OBJC_BRIDGING_HEADER: Stone/Stone-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/FossilBridge
        INFOPLIST_FILE: Stone/Info.plist
        # App icon lives in Stone/Assets.xcassets (single 1024x1024 universal
        # icon; Xcode derives all sizes). XcodeGen does not set this default.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Fossil opens its own sockets for sync; WKWebView talks to the
        # loopback server. ATS local-networking exception is set in Info.plist.
        # Automatic signing: Xcode provisions an "Apple Development" cert and a
        # development profile for this team. Sideload/personal builds only.
        DEVELOPMENT_TEAM: BWWLLRK896
        CODE_SIGN_STYLE: Automatic

  # Regression-test safety net (Stone Plan Milestone 1, ticket cfcc7e04d5).
  # Host-app-hosted unit tests: runs inside Stone.app's process via TEST_HOST,
  # so it reuses the app's own linked FossilCore rather than re-linking it.
  # NOTE: project.pbxproj currently also carries this target by hand (see the
  # comment at the top of this file re: xcodegen not being run in this
  # environment) -- once `xcodegen generate` is actually run, this block
  # becomes the source of truth and the hand-added pbxproj target should
  # match or be regenerated from it.
  StoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoneTests
    dependencies:
      - target: Stone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beagleboard.stone.StoneTests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: BWWLLRK896
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stone.app/Stone"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI-test slice of the same regression-test safety net (ticket cfcc7e04d5
  # part 2): drives the real app through XCUIApplication rather than calling
  # Swift services directly, so it catches things StoneTests structurally
  # can't -- e.g. the embedded Fossil server actually starting and WKWebView
  # actually rendering a page. See the NOTE on StoneTests above: this target
  # is also hand-added to project.pbxproj in parallel, for the same reason.
  StoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StoneUITests
    dependencies:
      - target: Stone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beagleboard.stone.StoneUITests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: BWWLLRK896
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Stone
