# XcodeGen project definition.
#
# Generate the Xcode project with XcodeGen.
# XcodeGen is not packaged in MacPorts, so build it from source once:
#     git clone --depth 1 --branch 2.43.0 https://github.com/yonaskolb/XcodeGen.git
#     cd XcodeGen && swift build -c release      # binary: .build/release/xcodegen
# Then, from this directory:
#     <path-to>/xcodegen generate
#
# Prerequisite: FossilCore.xcframework must exist (built by
# scripts/build-fossil-xcframework.sh). The app target only links that one
# artifact plus system libraries, keeping the project small and the Fossil
# core cleanly decoupled.

name: Stone
options:
  bundleIdPrefix: com.stone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Stone:
    type: application
    platform: iOS
    sources:
      - path: Stone
      - path: FossilBridge
        # Only the public header is needed by Swift; the .c is already compiled
        # into FossilCore.xcframework. Exclude the .c to avoid double-building.
        excludes:
          - "StoneFossil.c"
      # Vendored Mozilla CA bundle, copied into the app bundle as a resource so
      # OpenSSL can verify https remotes (iOS has no OpenSSL-readable store).
      - path: ../vendor/cacert.pem
        buildPhase: resources
    dependencies:
      - framework: Frameworks/FossilCore.xcframework
        embed: false            # static library — linked, not embedded
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stone.app
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        SWIFT_OBJC_BRIDGING_HEADER: Stone/Stone-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/FossilBridge
        INFOPLIST_FILE: Stone/Info.plist
        # Fossil opens its own sockets for sync; WKWebView talks to the
        # loopback server. ATS local-networking exception is set in Info.plist.
